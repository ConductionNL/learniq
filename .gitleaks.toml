# gitleaks configuration: the default rules, plus allowlists for findings
# that are not secrets. Each allowlist names the exact files and only the
# rules that fire there, so anything else in those files is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Documentation examples: the default admin:admin login of the local development and demo containers."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)docs/Installation/demo\-environment\.md$''',
]

[[allowlists]]
description = "Admin guide example: curl with the default admin:admin login of the local development container."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)docs/Technical/admin\-guide\.md$''',
]

[[allowlists]]
description = "Proposal prose: the words cmi5/xAPI/SCORM after the word API, not a key."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)openspec/changes/archive/2026\-07\-16\-course\-evaluation/proposal\.md$''',
]

[[allowlists]]
description = "Example-set seed script: a group slug (an exam committee id), not a credential."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)scripts/example\-sets/mbo\.py$''',
]

[[allowlists]]
description = "SCORM runtime: the assignment window.API = this (the SCORM API object), not a key."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)src/views/LessonPlayer\.vue$''',
]

[[allowlists]]
description = "Unit test: a made-up wrong secret used to prove a forged assertion is rejected."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)tests/Unit/Portal/PortalAssertionVerifierTest\.php$''',
]

[[allowlists]]
description = "E2E seed script: curl login built from the ADMIN_USER/ADMIN_PASSWORD environment variables, not a literal."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)tests/e2e/ci\-seed\.sh$''',
]
