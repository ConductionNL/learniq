description:
  en:
    shortDescription: >
      Learning management and educational administration for Nextcloud.
    longDescription: >
      Scholiq is a learning management system (LMS) built on Nextcloud and Open Register.
      It supports course management, student enrolment, progress tracking, and educational
      administration. Designed for Dutch educational institutions and government training
      programmes, it integrates with existing Nextcloud collaboration tools and adheres
      to Dutch government interoperability standards.
      Conduction maintains this component within the Nextcloud ISV programme.
      Install it from the Nextcloud App Store at https://apps.nextcloud.com/apps/learniq.
    features:
      - Course and lesson management with lifecycle-gated publishing
      - Bulk enrolment in mandatory training by group or role
      - Due-date reminders and progress tracking per enrolment
      - Signed attestations per learner
      - Open Badges 3.0 credentials with public verification
      - Certificate expiry alerts and renewal enrolment
      - Coverage per regulation (NIS2, AVG, BIO) with an audit-pack export
      - School-year rollover with a side-effect-free preview
      - IMS QTI and Common Cartridge item-bank import
      - cmi5 lessons with results kept in its own learning record store
    screenshots:
      - docs/static/screenshots/tutorials/admin/01-school-structure-01.png
      - docs/static/screenshots/tutorials/admin/02-compliance-audit-01.png
      - docs/static/screenshots/tutorials/user/04-assignments-02.png

  nl:
    shortDescription: >
      Leerbeheersysteem en onderwijsadministratie voor Nextcloud.
    longDescription: >
      Scholiq is een leerbeheersysteem (LMS) gebouwd op Nextcloud en Open Register.
      Het ondersteunt cursusmanagement, inschrijving van studenten, voortgangsbewaking
      en onderwijsadministratie. Ontworpen voor Nederlandse onderwijsinstellingen en
      overheidsopleidingen, integreert het met bestaande Nextcloud-samenwerkingstools
      en voldoet aan Nederlandse overheidsstandaarden voor interoperabiliteit.
      Conduction onderhoudt dit component binnen het Nextcloud ISV-programma.
      Installeer het via de Nextcloud App Store op https://apps.nextcloud.com/apps/learniq.
    features:
      - Beheer van cursussen en lessen met publicatie in fasen
      - Massaal inschrijven voor verplichte trainingen per groep of rol
      - Herinneringen voor deadlines en voortgang per inschrijving
      - Ondertekende verklaringen per deelnemer
      - Open Badges 3.0-certificaten met openbare verificatie
      - Signalering van verlopende certificaten en inschrijving voor verlenging
      - Dekking per regelgeving (NIS2, AVG, BIO) met export van een auditpakket
      - Overgang naar een nieuw schooljaar met een voorbeeld zonder gevolgen
      - Import van itembanken in IMS QTI en Common Cartridge
      - cmi5-lessen met resultaten in een eigen learning record store
    screenshots:
      - docs/static/screenshots/tutorials/admin/01-school-structure-01.png
      - docs/static/screenshots/tutorials/admin/02-compliance-audit-01.png
      - docs/static/screenshots/tutorials/user/04-assignments-02.png

